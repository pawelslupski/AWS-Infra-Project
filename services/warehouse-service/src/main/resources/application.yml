server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: warehouse-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/warehouse}
    username: ${SPRING_DATASOURCE_USERNAME:warehouse}
    password: ${SPRING_DATASOURCE_PASSWORD:warehouse}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: warehouse-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.example.warehouse.PaymentCompletedEvent
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    topic:
      payments-completed: ${APP_KAFKA_TOPIC_PAYMENTS_COMPLETED:payments.completed}
